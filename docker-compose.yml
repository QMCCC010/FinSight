services:
  mysql:
    image: mysql:8.0.45
    environment:
      MYSQL_DATABASE: finresearch
      MYSQL_USER: finresearch
      MYSQL_PASSWORD: finresearch
      MYSQL_ROOT_PASSWORD: root-password
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot-password"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd --advertise-client-urls=http://milvus-etcd:2379 --listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus_minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.6.22
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 90s
      timeout: 10s
      retries: 10

  api:
    build:
      context: ./backend
    command: sh -c "alembic -c alembic.ini upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - app_data:/app/data
      - model_cache:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  collector:
    build:
      context: ./backend
    command: flask --app app.collector.main run --host 0.0.0.0 --port 5000
    env_file: .env
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      - app_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app:celery worker --loglevel=INFO --queues=collection,maintenance --concurrency=1 --max-tasks-per-child=20 --hostname=collection@%h
    env_file: .env
    volumes:
      - ./backend:/app
      - app_data:/app/data
      - model_cache:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  chat-worker:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app:celery worker --loglevel=INFO --queues=chat --concurrency=1 --max-tasks-per-child=50 --hostname=chat@%h
    env_file: .env
    volumes:
      - ./backend:/app
      - app_data:/app/data
      - model_cache:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  ai-background-worker:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app:celery worker --loglevel=INFO --queues=reports,chat_memory --concurrency=1 --max-tasks-per-child=30 --hostname=ai-background@%h
    env_file: .env
    volumes:
      - ./backend:/app
      - app_data:/app/data
      - model_cache:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  on-demand-worker:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app:celery worker --loglevel=INFO --queues=collection_ondemand --concurrency=1 --max-tasks-per-child=10 --hostname=ondemand@%h
    env_file: .env
    volumes:
      - ./backend:/app
      - app_data:/app/data
      - model_cache:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app:celery beat --loglevel=INFO
    env_file: .env
    volumes:
      - ./backend:/app
      - app_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
  app_data:
  model_cache:
  frontend_modules:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
